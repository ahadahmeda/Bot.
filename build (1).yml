name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip project (any zip, any name)
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then echo "ERROR: repo-te kono .zip file nei"; exit 1; fi
          echo "Using zip: $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/proj"
          SETTINGS=$(find "$RUNNER_TEMP/proj" -name 'settings.gradle*' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "ERROR: settings.gradle paoa jay nai"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/AutoRenew.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoRenew-apk
          path: out/AutoRenew.apk

      - name: Publish release (সরাসরি APK ডাউনলোডের জন্য)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoRenew build ${{ github.run_number }}
          files: out/AutoRenew.apk
